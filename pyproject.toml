[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "postSPIT"
version = "0.1.0"
description = "Post-processing and plotting tools for SPIT microscopy analysis"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.3,<2",
    "pandas>=2.1.1,<3",
    "matplotlib>=3.7.3,<4",
    "scipy>=1.11.2,<2",
    "scikit-image>=0.25.0,<1",
    "scikit-learn>=1.6.1,<2",
    "opencv-python>=4.11.0.86,<5",
    "tifffile>=2024.12.12",
    "trackpy>=0.6.4,<1",
    "natsort>=8.4.0,<9",
    "tqdm>=4.66.1,<5",
    "PyYAML>=6.0.1,<7",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["postSPIT*"]
